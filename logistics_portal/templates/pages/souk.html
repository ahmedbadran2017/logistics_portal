{%- block head %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- Kept in step with the in-app theme toggle by composables/useTheme.js. -->
<meta name="theme-color" content="#ffffff">
<title>Justyol Souk</title>

<!-- The souk sourcing app: its own bundle (logistics_souk.bundle.js), shell
     and login. Installable with its own manifest and service worker
     (api/souk_pwa.py): the buyer works from a phone in the market, the app
     opens and keeps what is entered even when the line drops. -->
<link rel="manifest" href="/assets/logistics_portal/souk.webmanifest">
<link rel="apple-touch-icon" href="/assets/logistics_portal/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Souk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
{{ include_style("logistics_souk.bundle.css") }}
{%- endblock %}

{%- block page_content %}
<div id="app"></div>
{%- endblock %}

{%- block script %}
<script>
    // Boot data injected by Frappe so the SPA knows the session user without a round-trip.
    window.frappe_boot = {
        user: "{{ frappe.session.user }}",
        csrf_token: "{{ frappe.session.csrf_token if frappe.session else '' }}",
        sitename: "{{ frappe.local.site }}",
    };
    window.csrf_token = "{{ frappe.session.csrf_token if frappe.session else '' }}";
</script>
{{ include_script("logistics_souk.bundle.js") }}
{%- endblock %}
